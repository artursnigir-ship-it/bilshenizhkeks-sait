<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Більше ніж кєкс · квіз для кав'ярень</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen phone app in the БНК Instagram system — blush paper, colour-block tiles (raspberry, green, mustard, chocolate),
   one appetising photo per screen. Single bright brand look by choice. */
:root{
  --paper:#FEF4F2; --choco:#281A17; --pink:#D15E7D; --pink-d:#B8486A; --green:#548D62; --mustard:#E8B655; --white:#FFFFFF;
  --muted:#7A5F5A; --line:#F0D9D4; --err:#C62F4B; --ok:#548D62;
  --f-display:"Montserrat Alternates","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--choco);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--choco);outline-offset:2px}
.wrap{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;height:44px}
.brand{display:flex;align-items:center;gap:10px;color:var(--choco);text-decoration:none}
.stamp{flex:none;width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.stamp b{font:500 13px var(--f-display);letter-spacing:.06em}
.stamp i{font-style:normal;font-size:5.5px;letter-spacing:.12em;margin-top:2px;border-top:1px solid rgba(255,255,255,.7);padding-top:2px}
.brand .nm{font:600 15px/1.05 var(--f-display)}
.brand .nm small{display:block;font:500 11px var(--f-body);color:var(--muted);margin-top:3px}
.tel{font-size:12.5px;font-weight:700;color:var(--choco);text-decoration:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{flex:none;height:5px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden;visibility:hidden}
body.q .bar{visibility:visible}
.bar i{display:block;height:100%;width:0;background:var(--pink);border-radius:9px;transition:width .6s var(--ease)}
.stage{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-block:14px 16px}
.stage::-webkit-scrollbar{display:none}
.screen{min-height:100%;display:flex;flex-direction:column;gap:14px;animation:in .45s var(--ease) both}
.screen.out{animation:out .2s ease-in both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-8px)}}
.push{margin-top:auto;display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;padding-top:14px;background:linear-gradient(180deg,rgba(254,244,242,0),var(--paper) 14px)}

h1,h2{margin:0;font-family:var(--f-display);font-weight:500;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,7.4vw,34px);line-height:1.1}
h2{font-size:clamp(22px,6vw,27px);line-height:1.15}
h1:focus,h2:focus{outline:none}
.pk{color:var(--pink)}
.kick{margin:0;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
.sub{margin:0;color:var(--muted);font-size:15px}

/* start */
.hero{position:relative;border-radius:22px;overflow:hidden;flex:1 1 150px;min-height:150px;max-height:210px;background:var(--choco)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 55%;max-width:none}
.tag{position:absolute;left:12px;top:12px;background:rgba(254,244,242,.94);color:var(--choco);border-radius:99px;padding:6px 11px;font-size:11.5px;font-weight:800;letter-spacing:.02em}
.who{margin:0;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.who::before{content:"";width:18px;height:2px;background:var(--pink)}
.offer{display:flex;align-items:stretch;background:var(--choco);color:#fff;border-radius:20px;overflow:hidden}
.offer .sum{flex:none;display:flex;flex-direction:column;justify-content:center;padding:14px 16px;background:var(--pink)}
.offer .sum small{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.offer .sum b{font:600 30px/1.05 var(--f-display);white-space:nowrap;letter-spacing:-.01em}
.offer .txt{padding:12px 14px;font-size:13.5px;line-height:1.4;display:flex;flex-direction:column;justify-content:center;gap:3px}
.offer .txt b{font-size:14.5px}
.offer .txt span{color:#E9D6D1}
.why{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.why li{background:#fff;border-radius:16px;padding:11px 12px;font-size:12.5px;line-height:1.35;color:var(--muted)}
.why li b{display:block;color:var(--choco);font-size:13.5px;margin-bottom:2px}
.why li i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--paper);color:var(--green);font-style:normal;font-size:12px;font-weight:800;margin-bottom:6px}
.btn{appearance:none;cursor:pointer;width:100%;border:0;border-radius:18px;padding:18px 20px;display:flex;align-items:center;justify-content:center;gap:10px;font:800 16px var(--f-body);transition:transform .15s,background .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--pink);color:#fff;box-shadow:0 14px 28px -12px rgba(209,94,125,.85)}
.btn.main:hover{background:var(--pink-d)}
.btn.dark{background:var(--choco);color:#fff}
.btn.soft{background:#fff;color:var(--choco);border:2px solid var(--line);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn .ar{font-size:20px;line-height:1}
.fine{margin:0;text-align:center;font-size:12px;color:var(--muted)}

/* options: colour-block tiles like the Instagram grid */
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{appearance:none;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;text-align:left;min-height:92px;border:0;border-radius:20px;padding:13px 14px;color:#fff;font-size:15px;font-weight:700;line-height:1.2;transition:transform .15s,box-shadow .2s;animation:in .4s var(--ease) both}
.opt small{display:block;font-size:12px;font-weight:500;opacity:.9}
.opt.c0{background:var(--pink)} .opt.c1{background:var(--green)} .opt.c2{background:var(--mustard);color:var(--choco)} .opt.c3{background:var(--choco)} .opt.c4{background:#fff;color:var(--choco);border:2px solid var(--line)}
.opt.full{grid-column:1/-1;min-height:64px}
.opt:hover{transform:translateY(-2px)}
.opt .ck{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;border:2px solid currentColor;opacity:.55;display:grid;place-items:center;font-size:13px;font-weight:800}
.opt.sel{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--choco)}
.opt.sel .ck{opacity:1;background:#fff;color:var(--choco);border-color:#fff}
.opt.ph{min-height:132px;justify-content:flex-end}
.opt.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.opt.ph::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,26,23,0) 30%,rgba(40,26,23,.75));z-index:1}
.opt.ph span,.opt.ph .ck{position:relative;z-index:2}
.opt.ph .ck{position:absolute}
.hint{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:16px;padding:11px 12px;font-size:13px;color:var(--muted)}
.hint .stamp{width:30px;height:30px}
.hint .stamp b{font-size:10px}
.hint .stamp i{display:none}
.hint b{color:var(--choco)}

/* loader */
.calc{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.cake{display:flex;gap:6px;height:70px;align-items:flex-end}
.cake span{width:20px;border-radius:12px 12px 4px 4px;animation:grow 1.2s var(--ease) infinite alternate}
.cake span:nth-child(1){background:var(--pink);animation-delay:0s}.cake span:nth-child(2){background:var(--green);animation-delay:.15s}.cake span:nth-child(3){background:var(--mustard);animation-delay:.3s}.cake span:nth-child(4){background:var(--choco);animation-delay:.45s}
@keyframes grow{from{height:18px}to{height:70px}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:9px;width:100%;max-width:300px;text-align:left}
.steps li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);transition:color .3s}
.steps li i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;color:transparent;transition:all .3s}
.steps li.done{color:var(--choco)} .steps li.done i{background:var(--green);color:#fff}

/* result */
.pack{border-radius:26px;overflow:hidden;background:var(--choco);color:#fff}
.pack .ph{height:120px;position:relative}
.pack .ph img{width:100%;height:100%;object-fit:cover;max-width:none}
.pack .ph span{position:absolute;left:14px;bottom:-14px;background:var(--mustard);color:var(--choco);border-radius:99px;padding:7px 13px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.pack .bd{padding:24px 16px 16px;display:flex;flex-direction:column;gap:10px}
.pack h2{color:#fff}
.pack h2 .pk{color:#F49AB3}
.pack ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.pack li{display:flex;gap:9px;font-size:14px;line-height:1.35}
.pack li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--pink);margin-top:6px}
.gift{display:flex;align-items:center;gap:12px;background:var(--pink);color:#fff;border-radius:20px;padding:13px 14px}
.gift b{font:600 26px/1 var(--f-display);white-space:nowrap}
.gift span{font-size:13.5px;font-weight:600;line-height:1.3}
.deliv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.deliv div{background:#fff;border-radius:16px;padding:11px 12px;font-size:12.5px;color:var(--muted)}
.deliv b{display:block;color:var(--choco);font-size:14px}

/* form */
.formcard{background:#fff;border-radius:24px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px -26px rgba(40,26,23,.45)}
.formcard .h b{display:block;font:600 18px/1.2 var(--f-display)}
.formcard .h small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
form{display:flex;flex-direction:column;gap:9px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px}
.field input{width:100%;font:600 16px var(--f-body);color:var(--choco);background:var(--paper);border:2px solid transparent;border-radius:14px;padding:14px;transition:border-color .2s,background .2s}
.field input::placeholder{color:#B39994;font-weight:500}
.field input:focus{outline:none;border-color:var(--pink);background:#fff}
.field.err input{border-color:var(--err)}
.e{font-size:12px;color:var(--err)} .e:empty{display:none}
.phone{display:flex;gap:8px}
.cc{position:relative;flex:none;display:flex;align-items:center;gap:5px;padding:0 11px;background:var(--paper);border:2px solid transparent;border-radius:14px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.cc .fl{font-size:18px;line-height:1} .cc .car{font-size:9px;color:var(--muted)}
.cc select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;appearance:none;border:0}
.cc:focus-within{border-color:var(--pink)}
.phone input{flex:1;min-width:0}
.seglbl{margin:2px 0 -3px;font-size:12px;color:var(--muted);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{appearance:none;cursor:pointer;min-width:0;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 2px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--choco);background:var(--choco);color:#fff}
.consent{margin:0;font-size:11px;color:var(--muted);text-align:center}
.send-err{padding:10px 12px;border-radius:12px;background:#FCE4E8;color:var(--err);font-size:13px}

/* thanks */
.done{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:30px;animation:pop2 .5s var(--ease) both}
@keyframes pop2{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.flow li{counter-increment:s;display:flex;gap:11px;align-items:flex-start;background:#fff;border-radius:16px;padding:11px 12px;font-size:14px;font-weight:600}
.flow li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:9px;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:13px}
.flow li:nth-child(2)::before{background:var(--green)}.flow li:nth-child(3)::before{background:var(--mustard);color:var(--choco)}.flow li:nth-child(4)::before{background:var(--choco)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.contact a{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:16px;padding:14px 8px;font-weight:800;font-size:14px}
.contact .c1{background:var(--choco);color:#fff}.contact .c2{background:#fff;color:var(--choco);border:2px solid var(--line)}
.pv{position:fixed;right:max(8px,env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:30;background:var(--choco);color:#fff;font-size:11px;padding:4px 10px;border-radius:99px;opacity:.8;pointer-events:none}
@media (max-height:700px){.hero{max-height:220px}.opt{min-height:78px}.opt.ph{min-height:110px}.btn{padding:15px 18px}.screen{gap:11px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* --- start screen: everything on one phone screen, photo takes the spare space --- */
body:not(.q) .screen{gap:12px}
body:not(.q) .hero{flex:1 1 0;min-height:92px;max-height:none}
body:not(.q) h1{font-size:clamp(24px,6.6vw,30px);line-height:1.08}
.offer .sum{padding:12px 15px}.offer .sum b{font-size:27px}.offer .txt{padding:10px 13px;font-size:13px}.offer .txt b{font-size:14px}
.why{gap:7px}
.why li{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:14px;font-size:11.5px;line-height:1.25}
.why li i{flex:none;margin:0;width:26px;height:26px;border-radius:8px}
.why li b{font-size:12.5px;margin:0}
body:not(.q) .push{padding-top:6px}
@media (max-height:640px){body:not(.q) .screen{gap:9px}.offer .txt span{display:none}body:not(.q) .who{display:none}}

/* --- loading screen --- */
.ld{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;width:100%}
.ld-ph{position:relative;width:188px;height:188px;flex:none}
.ld-ph img{position:absolute;inset:16px;width:156px;height:156px;border-radius:50%;object-fit:cover;max-width:none;opacity:0;transform:scale(.92);transition:opacity .45s var(--ease),transform .6s var(--ease)}
.ld-ph img.on{opacity:1;transform:none}
.ld-ring{position:absolute;inset:0;width:188px;height:188px;transform:rotate(-90deg)}
.ld-ring circle{fill:none;stroke:var(--line);stroke-width:7}
.ld-ring circle.fg{stroke:var(--pink);stroke-linecap:round}
.ld-pc{margin:-6px 0 0;font:600 15px var(--f-display);color:var(--pink);font-variant-numeric:tabular-nums}
.ld-steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%;max-width:340px;text-align:left}
.ld-steps li{display:flex;align-items:center;gap:11px;background:#fff;border-radius:14px;padding:9px 12px;font-size:13.5px;font-weight:700;color:var(--choco);opacity:.35;transform:translateY(4px);transition:opacity .35s,transform .35s var(--ease)}
.ld-steps li small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ld-steps li i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;color:transparent;transition:all .3s}
.ld-steps li.ok{opacity:1;transform:none}
.ld-steps li.ok i{background:var(--green);color:#fff}
@media (max-height:640px){.ld-ph{width:140px;height:140px}.ld-ph img{inset:12px;width:116px;height:116px}.ld-ring{width:140px;height:140px}}

/* --- photos: whole dish visible (contain) over a blurred copy of the same photo --- */
.hero img,.pack .ph img{object-fit:contain!important;object-position:50% 50%!important;z-index:1}
.hero img.bgb,.pack .ph img.bgb,.ld-ph img.bgb{object-fit:cover!important;filter:blur(18px) saturate(1.1);transform:scale(1.2);z-index:0}
.pack .ph{height:170px;overflow:hidden}
.pack .ph img{position:absolute;inset:0}
.pack .ph span{z-index:2;bottom:10px}
.hero .tag{z-index:2}
.ld-ph .pic{position:absolute;inset:16px;border-radius:50%;overflow:hidden;opacity:0;transform:scale(.92);transition:opacity .45s var(--ease),transform .6s var(--ease)}
.ld-ph .pic.on{opacity:1;transform:none}
.ld-ph .pic img{position:absolute;inset:0;width:100%;height:100%;max-width:none;border-radius:0;opacity:1;transform:none;object-fit:contain}
@media (max-height:640px){.ld-ph .pic{inset:12px}}
</style>

/* ===================== НАЛАШТУВАННЯ ===================== */

function pickPack(){
  if(A.format===3||A.format===4||A.traffic===3||A.want.includes(3)||A.want.includes(4))return"full";
  if(A.traffic===2||A.want.includes(1)||A.format===2)return"std";
  return"start";
}
const kyiv=()=>A.area===0||A.area===1;

const $=s=>document.querySelector(s), stage=$("#stage");
let bind=()=>{};
function swap(html){
  const old=stage.firstElementChild;

}

function go(i){
  if(i>=Q.length)return calc();
  const q=Q[i]; qmode(true);
  $("#barI").style.width=(i/(Q.length+1)*100)+"%";requestAnimationFrame(()=>{$("#barI").style.width=((i+1)/(Q.length+1)*100)+"%";});
  const isSel=k=>q.multi?A.want.includes(k):A[q.key]===k;
  bind=()=>{
    $("#back").onclick=()=>i?go(i-1):start();
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.i;
      if(q.multi){A.want=A.want.includes(k)?A.want.filter(x=>x!==k):[...A.want,k];b.classList.toggle("sel");b.setAttribute("aria-pressed",A.want.includes(k));$("#mGo").disabled=!A.want.length;return;}
      stage.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");
      A[q.key]=k;track("QuizStep",{step:i+1,question:q.key});setTimeout(()=>go(i+1),320);
    });
    const m=$("#mGo");if(m)m.onclick=()=>{track("QuizStep",{step:i+1,question:q.key});go(i+1);};
  };
  swap(`
    <button class="btn soft" id="back" type="button" style="width:auto;align-self:flex-start;padding:8px 14px;font-size:13px">← Назад</button>
    <p class="kick">Крок ${i+1}/${Q.length} · ${q.kick}</p>
    <h2>${q.q}</h2>${q.sub?`<p class="sub" style="margin-top:-6px">${q.sub}</p>`:""}
    <div class="opts two" role="group" aria-label="${q.label}">${q.opts.map((o,k)=>`<button class="opt ${o.img?"ph":COLORS[k%5]}${o.full?" full":""}${isSel(k)?" sel":""}" data-i="${k}" ${q.multi?`aria-pressed="${isSel(k)}"`:""} style="animation-delay:${k*45}ms">${o.img?`<img src="${IMG[o.img]}" alt="">`:""}<span class="ck">✓</span><span>${o.t}${o.s?`<small>${o.s}</small>`:""}</span></button>`).join("")}</div>
    ${q.hint?`<div class="hint"><span class="stamp"><b>БНК</b><i></i></span><span>${q.hint}</span></div>`:""}
    ${q.multi?`<div class="push"><button class="btn main" id="mGo" ${A.want.length?"":"disabled"}>Далі <span class="ar">→</span></button></div>`:""}
  `);
}

function calc(){
  qmode(true);$("#barI").style.width=(Q.length/(Q.length+1)*100)+"%";
  const qt=(key,k)=>{const q=Q.find(x=>x.key===key);return q&&q.opts[k]?q.opts[k].t:"";};
  const P=PACKS[pickPack()], dv=DELIV[A.area]||DELIV[0], gift=CONFIG.OFFER&&kyiv();
  const steps=[
    ["Ваш заклад", qt("format",A.format)+" · "+qt("traffic",A.traffic)+(A.traffic===4?"":" чеків на день")],
    ["Асортимент", "пакет «"+P.n+"» під ваш трафік"],
    ["Доставка", qt("area",A.area)+": "+dv.d],
    gift?["Дегустація","сет 15 позицій за "+CONFIG.OFFER_SUM+" грн"]:["Дегустація","готуємо дегустаційний сет"],
  ];
  const pics=["mac","tart","kish","trub"];
  const R=54, L=2*Math.PI*R, T=450+steps.length*520;
  bind=()=>{
    const ring=stage.querySelector(".ld-ring .fg"), pc=stage.querySelector(".ld-pc"), li=[...stage.querySelectorAll(".ld-steps li")], ph=[...stage.querySelectorAll(".ld-ph .pic")];
    const t0=performance.now();
    const tick=now=>{const p=Math.min(1,(now-t0)/T);const e=1-Math.pow(1-p,2);ring.style.strokeDashoffset=L*(1-e);pc.textContent=Math.round(e*100)+"%";if(p<1)requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
    li.forEach((l,k)=>setTimeout(()=>l.classList.add("ok"),350+k*520));
    ph.forEach((im,k)=>setTimeout(()=>{ph.forEach(x=>x.classList.remove("on"));im.classList.add("on");},k*(T/ph.length)));
    setTimeout(result,T+350);
  };
  swap(`<div class="ld">
    <div class="ld-ph">
      ${pics.map((k,n)=>`<div class="pic${n===0?" on":""}"><img class="bgb" src="${IMG[k]}" alt=""><img src="${IMG[k]}" alt=""></div>`).join("")}
      <svg class="ld-ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${R}"></circle><circle class="fg" cx="60" cy="60" r="${R}" style="stroke-dasharray:${L};stroke-dashoffset:${L}"></circle></svg>
    </div>
    <p class="ld-pc" aria-hidden="true">0%</p>
    <h2>Підбираємо <span class="pk">вашу вітрину</span></h2>
    <ul class="ld-steps">${steps.map(([a,b])=>`<li><i>✓</i><span><small>${a}</small>${b}</span></li>`).join("")}</ul>
  </div>`);
}

const PH_LEN={UA:[9,9],PL:[9,9],CZ:[9,9],SK:[9,9],LT:[8,8],LV:[8,8],EE:[7,8],MD:[8,8],RO:[9,9],DE:[10,11],GB:[10,10],US:[10,10],CA:[10,10],IT:[9,10],ES:[9,9],PT:[9,9],FR:[9,9],NL:[9,9],BE:[8,9],AT:[10,13],IE:[9,9],IL:[9,9],GR:[10,10],HR:[8,9],HU:[8,9],BG:[8,9],DK:[8,8],SE:[7,9],NO:[8,8],FI:[6,10],CH:[9,9],TR:[10,10],GE:[9,9],AE:[9,9],ME:[8,8],SI:[8,8],RS:[8,9]};
const PH_FMT={UA:[2,3,2,2],PL:[3,3,3],CZ:[3,3,3],SK:[3,3,3],ES:[3,3,3],PT:[3,3,3]};
const PH_EX={UA:"67 123 45 67",PL:"512 345 678",CZ:"601 123 456",SK:"912 123 456",DE:"151 23456789",GB:"7400 123456",IT:"312 345 6789",ES:"612 345 678",LT:"612 34567",MD:"621 12345",RO:"712 345 678",HR:"91 234 5678",GR:"691 234 5678",US:"201 555 0123"};

const flagOf=c=>String.fromCodePoint(...[...c].map(ch=>127397+ch.charCodeAt(0)));
const ccName=(()=>{let dn=null;try{dn=new Intl.DisplayNames(["uk"],{type:"region"});}catch(e){}return c=>{try{return (dn&&dn.of(c))||c}catch(e){return c}};})();

let phoneCC=(()=>{try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;if(TZ_CC[tz])return TZ_CC[tz];}catch(e){}
  try{const r=(navigator.language||"").split("-")[1];if(r&&DIAL[r.toUpperCase()])return r.toUpperCase();}catch(e){}return "UA";})();
let ccTouched=false,onGeo=null;
(function geo(){if(PREVIEW)return;try{const ac=new AbortController();setTimeout(()=>ac.abort(),3000);
  fetch("https://api.country.is/",{signal:ac.signal}).then(r=>r.json()).then(j=>{const c=(j&&j.country||"").toUpperCase();if(DIAL[c]&&!ccTouched){phoneCC=c;onGeo&&onGeo(c);}}).catch(()=>{});}catch(e){}})();
const phLen=c=>PH_LEN[c]||[6,Math.max(6,14-DIAL[c].length)];
function phDigits(raw,c){let d=raw.replace(/\D/g,"");const code=DIAL[c],[,mx]=phLen(c);
  if(d.length>mx&&d.startsWith(code))d=d.slice(code.length);
  if(d.startsWith("00"+code))d=d.slice(2+code.length);
  if(c!=="IT"&&d.startsWith("0"))d=d.slice(1);
  return d.slice(0,mx);}
function phFormat(d,c){const g=PH_FMT[c];const out=[];let i=0;
  if(g){for(const n of g){if(i>=d.length)break;out.push(d.slice(i,i+n));i+=n;}if(i<d.length)out.push(d.slice(i));}
  else{while(i<d.length){out.push(d.slice(i,i+3));i+=3;}}
  return out.join(" ");}
function ccOptions(sel){const all=Object.keys(DIAL);const rest=all.filter(c=>!PH_PRIORITY.includes(c)).sort((a,b)=>ccName(a).localeCompare(ccName(b),"uk"));
  const opt=c=>`<option value="${c}"${c===sel?" selected":""}>${flagOf(c)} ${ccName(c)} +${DIAL[c]}</option>`;
  return `<optgroup label="Популярні">${PH_PRIORITY.filter(c=>DIAL[c]).map(opt).join("")}</optgroup><optgroup label="Усі країни">${rest.map(opt).join("")}</optgroup>`;}

function formBind(P){
  const f=$("#lead"),ph=$("#phone"),ccSel=$("#cc");
  const clr=el=>el.closest(".field").classList.remove("err");
  const setCC=c=>{phoneCC=c;ccSel.value=c;$("#ccFlag").textContent=flagOf(c);$("#ccCode").textContent="+"+DIAL[c];ph.placeholder=PH_EX[c]||"Номер телефону";ph.value=phFormat(phDigits(ph.value,c),c);};
  ccSel.onchange=()=>{ccTouched=true;setCC(ccSel.value);clr(ph);$("#phE").textContent="";};
  onGeo=c=>{if(!ccTouched&&!ph.value)setCC(c);}; setCC(phoneCC);
  ph.addEventListener("input",()=>{let v=ph.value.trim();
    if(v.startsWith("+")||v.startsWith("00")){const all=v.replace(/\D/g,"").replace(/^00/,"");let best=null;for(const c of Object.keys(DIAL)){const k=DIAL[c];if(all.startsWith(k)&&(!best||k.length>DIAL[best].length||(k===DIAL[best]&&PH_PRIORITY.includes(c)&&!PH_PRIORITY.includes(best))))best=c;}
      if(best&&all.length>DIAL[best].length){ccTouched=true;setCC(best);v=all.slice(DIAL[best].length);}else{ph.value="+"+all.slice(0,4);clr(ph);$("#phE").textContent="";return;}}
    ph.value=phFormat(phDigits(v,phoneCC),phoneCC);clr(ph);$("#phE").textContent="";});
  [["name","#nmE"]].forEach(([id,e])=>$("#"+id).oninput=()=>{clr($("#"+id));$(e).textContent="";});
  const seg=(id,get,set)=>{const s=$("#"+id);const draw=()=>s.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===get()));s.querySelectorAll("button").forEach(b=>b.onclick=()=>{set(b.dataset.v);draw();});draw();};
  seg("roleSeg",()=>role,v=>role=v); seg("viaSeg",()=>contactVia,v=>contactVia=v);
  let started=false; f.addEventListener("focusin",()=>{if(!started){started=true;track("FormStart");}});
  f.onsubmit=async e=>{
    e.preventDefault();
    const name=$("#name").value.trim(),digits=ph.value.replace(/\D/g,"");
    let ok=true;
    if(name.length<2){ok=false;$("#name").closest(".field").classList.add("err");$("#nmE").textContent="Вкажіть ім'я";}
    const [mn,mx]=phLen(phoneCC);
    if(digits.length<mn||digits.length>mx){ok=false;ph.closest(".field").classList.add("err");$("#phE").textContent=mn===mx?`Потрібно ${mn} цифр після +${DIAL[phoneCC]}`:`Перевірте номер: ${mn}–${mx} цифр після +${DIAL[phoneCC]}`;}
    if(!ok){const el=stage.querySelector(".field.err input");if(el)el.focus();return;}
    const btn=$("#send");btn.dataset.orig=btn.dataset.orig||btn.innerHTML;btn.disabled=true;btn.textContent="Надсилаємо…";const se=$("#sendErr");if(se)se.remove();
    const qt=(key,k)=>{const q=Q.find(x=>x.key===key);return q&&q.opts[k]?q.opts[k].t:"";};
    const fmt=qt("format",A.format), tr=qt("traffic",A.traffic), want=A.want.map(k=>qt("want",k)).join(", "), area=qt("area",A.area);
    const offer=CONFIG.OFFER&&kyiv()?`Дегустаційний сет 15 позицій за ${CONFIG.OFFER_SUM} грн, зараховується в перше замовлення`:"Дегустаційний сет";
    // назву й адресу закладу менеджер уточнює на дзвінку; у таблицю йде позначка, щоб обов'язкові поля форми не були порожні
    const place="уточнити на дзвінку ("+fmt+")", addr="уточнити на дзвінку · "+area;
    const lead={name,place,address:addr,instagram:"",phone:"+"+DIAL[phoneCC]+digits,phone_country:ccName(phoneCC),role,messenger:contactVia,
      format:fmt,traffic:tr,want,area,pack:P.n,offer,
      level:"🧁 БНК · "+name+" · "+fmt,goal:"Пакет «"+P.n+"» · "+offer,loc:area,date:"Чеків/день: "+tr,
      source:"bnk-quiz",page:location.href,ts:new Date().toISOString(),...UTM};
    lead.lead_id=window.__lid||(window.__lid=Date.now().toString(36)+Math.random().toString(36).slice(2,8));
    const res=await sendLead(lead);
    if(!res.ok){sendFail(btn);return;}
    goThankYouUrl();
    track("Lead",{content_name:"bnk_"+pickPack(),value:1,currency:"UAH"});track("CompleteRegistration");
    thanks(lead);
  };
}
function goThankYouUrl(){
  if(PREVIEW)return;
  try{history.pushState({thanks:1},"","/dyakuyu/"+location.search);}catch(e){}
  try{if(window.gtag)gtag('event','page_view',{page_location:location.href,page_path:'/dyakuyu/',page_title:'Дякуємо — заявку прийнято'});}catch(e){}
}
async function sendLead(lead){
  if(PREVIEW){console.info("Перегляд: заявку не надіслано",lead);await new Promise(r=>setTimeout(r,900));return {ok:true,preview:true};}
  if(!CONFIG.WEBHOOK_URL)return sendForm(lead);
  const body=JSON.stringify(lead);
  for(let i=0;i<3;i++){
    try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),12000);
      const r=await fetch(CONFIG.WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body,signal:ctl.signal});clearTimeout(t);
      const j=await r.json().catch(()=>null);if(j&&j.ok)return j;}catch(e){}
    if(i<2)await new Promise(r=>setTimeout(r,1200*(i+1)));
  }
  return {ok:false};
}
async function sendForm(l){
  const salty=/Солоне|Повна/.test(l.want+" "+l.pack);
  const f=new URLSearchParams();
  f.append("entry.1469003013",l.place);
  f.append("entry.1428473894",l.address);
  f.append("entry.2028405576",l.area==="Лівий берег"?"Лівий":"Правий");
  f.append("entry.1415146284",l.name+" ("+l.role+")");
  f.append("entry.1178902668",l.phone);
  if(l.instagram)f.append("entry.1105663941",l.instagram);
  f.append("entry.619929684",l.format==="Мережа"?"2–3":"1");
  f.append("entry.1382808586","Солодке");
  if(salty)f.append("entry.1382808586","Солоне");
  const utm=[l.utm_source,l.utm_campaign,l.utm_content].filter(Boolean).join(" / ");
  f.append("entry.1040253570",["КВІЗ","пропозиція: "+l.offer,"пакет: "+l.pack,"район: "+l.area,"формат: "+l.format,"чеків на день: "+l.traffic,
    "зв'язок: "+l.messenger,utm?"реклама: "+utm:""].filter(Boolean).join("; "));
  for(let i=0;i<2;i++){
    try{await fetch(CONFIG.FORM_URL,{method:"POST",mode:"no-cors",body:f});return {ok:true};}catch(e){}
    await new Promise(r=>setTimeout(r,1200));
  }
  return {ok:false};
}
function sendFail(btn){
  btn.disabled=false;btn.innerHTML=btn.dataset.orig;
  let el=$("#sendErr");if(!el){el=document.createElement("div");el.id="sendErr";el.className="send-err";el.setAttribute("role","alert");btn.insertAdjacentElement("afterend",el);}
  el.innerHTML=`Не вдалося надіслати заявку. Спробуйте ще раз або зателефонуйте: <b>${CONFIG.PHONE_TXT}</b>`;
  track("LeadSendFailed");
}
function thanks(lead){
  qmode(false);
  bind=()=>{stage.querySelectorAll(".contact a").forEach(a=>a.onclick=()=>track("Contact",{via:a.dataset.v}));};
  const gift=lead.offer.includes(" грн");
  swap(`
    <div class="done" aria-hidden="true">✓</div>
    <h2>Дякуємо, <span class="pk">${lead.name.replace(/[<>&"]/g,"")}</span>! Заявку прийнято</h2>
    <p class="sub">Менеджер зателефонує в робочий час (пн–пт) і підбере набір під вашу вітрину.</p>
    <ol class="flow">
      <li>Дзвінок: уточнюємо формат і що продається у ваших гостей</li>
      <li>${gift?`Привозимо дегустаційний сет 15 позицій за ${CONFIG.OFFER_SUM} грн (суму зарахуємо в перше замовлення)`:"Привозимо дегустаційний сет"} разом із прайсом і маржею по кожній позиції</li>
      <li>Через 2–3 дні питаємо, що продалося, і що замовити далі</li>
      <li>Далі поставки за графіком, від мінімальної суми за передоплатою</li>
    </ol>
    <div class="contact"><a class="c1" data-v="phone" href="tel:${CONFIG.PHONE}">Зателефонувати</a><a class="c2" data-v="instagram" href="https://ig.me/m/${CONFIG.INSTAGRAM}" target="_blank" rel="noopener">Написати в Direct</a></div>
    <p class="fine">${CONFIG.PHONE_TXT} · пн–пт, Київ і область</p>
  `);
}

if(PREVIEW){const p=document.createElement("div");p.className="pv";p.textContent="Перегляд · заявки не надсилаються";document.body.appendChild(p);}
start();
</script>
