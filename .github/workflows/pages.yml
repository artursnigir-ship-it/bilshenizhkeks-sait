# Публікація сайту на GitHub Pages після кожної зміни в main.
# Спершу перевірка квізу (perevirka-kvizu.js): якщо квіз втратив зв'язок
# із Google Формою заявок, публікація зупиняється, а на сайті лишається попередня версія.
name: Публікація сайту

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Перевірка квізу
        run: node perevirka-kvizu.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
